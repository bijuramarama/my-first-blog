{% extends 'base.html' %}

{% block title %}Edit Trip{% endblock %}

{% block content %}
  <h1>Edit Trip</h1>
  <form method="post">
    <input type="text" name="name" value="{{ trip.name }}" required>
    <input type="text" name="destination" value="{{ trip.destination }}" required>
    <select name="status">
      <option value="upcoming" {% if trip.status == 'upcoming' %}selected{% endif %}>Upcoming</option>
      <option value="ongoing" {% if trip.status == 'ongoing' %}selected{% endif %}>Ongoing</option>
      <option value="completed" {% if trip.status == 'completed' %}selected{% endif %}>Completed</option>
    </select>
    <button type="submit">Update Trip</button>
  </form>
{% endblock %}
