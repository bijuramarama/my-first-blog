{% extends 'base.html' %}

{% block title %}Film Crew Management{% endblock %}

{% block content %}
  <h1>Film Crew</h1>
  <form action="{{ url_for('add_member') }}" method="post">
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="role" placeholder="Role" required>
    <input type="text" name="country" placeholder="Country" required>
    <button type="submit">Add Member</button>
  </form>
  <ul>
    {% for member in crew %}
      <li>
        {{ member.name }} - {{ member.role }} - {{ member.country }}
        <a href="{{ url_for('edit_member', member_id=member._id) }}">Edit</a>
        <a href="{{ url_for('delete_member', member_id=member._id) }}">Delete</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
