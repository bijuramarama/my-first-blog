{% extends 'base.html' %}

{% block title %}Edit Member{% endblock %}

{% block content %}
  <h1>Edit Member</h1>
  <form method="post">
    <input type="text" name="name" value="{{ member.name }}" required>
    <input type="text" name="role" value="{{ member.role }}" required>
    <input type="text" name="country" value="{{ member.country }}" required>
    <button type="submit">Update Member</button>
  </form>
{% endblock %}
