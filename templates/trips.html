{% extends 'base.html' %}

{% block title %}Trip Management{% endblock %}

{% block content %}
  <h1>Trips</h1>
  <form action="{{ url_for('add_trip') }}" method="post">
    <input type="text" name="name" placeholder="Trip Name" required>
    <input type="text" name="destination" placeholder="Destination" required>
    <button type="submit">Add Trip</button>
  </form>
  <ul>
    {% for trip in trips %}
      <li>
        {{ trip.name }} - {{ trip.destination }} - {{ trip.status }}
        <a href="{{ url_for('edit_trip', trip_id=trip._id) }}">Edit</a>
        <a href="{{ url_for('delete_trip', trip_id=trip._id) }}">Delete</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
